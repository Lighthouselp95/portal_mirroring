<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Portal</title>
    <style>
        /* Toàn bộ giao diện chuyển sang tông màu tối giản, không màu sắc */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #ffffff;
            padding: 20px;
            margin: 0;
            font-size: 16px;
            color: #1a1a1a;
        }

        /* Khung chứa thiết kế phẳng tuyệt đối, mỏng và tối giản */
        .box {
            max-width: 700px;
            margin: 20px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }

        .hidden {
            display: none;
        }

        h2 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #000000;
            font-weight: 700;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            color: #333333;
        }

        /* Ô nhập liệu tinh gọn */
        input {
            width: 100%;
            padding: 10px 12px;
            margin: 6px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #ffffff;
        }

        input:focus {
            border-color: #000000;
            outline: none;
        }

        /* Nút bấm phẳng đen/trắng đơn giản */
        button {
            width: 100%;
            padding: 12px;
            background: #000000;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        button:hover {
            background: #222222;
        }

        /* DANH SÁCH ITEMS: Ép mỏng tối đa chiều dọc, bỏ toàn bộ màu cam/xanh */
        .log-item {
            padding: 6px 12px;
            /* Giảm padding dọc xuống còn 6px cực mỏng */
            margin: 6px 0;
            /* Thu hẹp khoảng cách giữa các dòng */
            border-radius: 0;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-left: 4px solid #000000;
            /* Tất cả dùng chung viền đen mặc định */
        }

        /* CALL và SMS chỉ phân biệt nhẹ bằng độ đậm nhạt của viền trái, KHÔNG DÙNG MÀU NỀN */
        .CALL {
            border-left-color: #000000;
        }

        /* Cuộc gọi: Viền đen đậm */
        .SMS {
            border-left-color: #888888;
        }

        /* Tin nhắn: Viền xám mờ */

        /* Phần chứa thời gian và loại log */
        .meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666666;
            margin-bottom: 2px;
        }

        /* Số điện thoại đối tác viết mỏng gọn */
        .log-target {
            font-size: 15px;
            font-weight: 600;
            color: #000000;
            display: inline-block;
            margin-right: 10px;
        }

        /* Nội dung tin nhắn / cuộc gọi được thu gọn tối đa */
        .log-content {
            margin-top: 2px;
            font-size: 14px;
            color: #333333;
            padding: 0;
            background: none;
            border: none;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <div id="login-screen" class="box">
        <h2>Đồng bộ thiết bị di động</h2>
        <label for="phone-input">Số điện thoại thiết bị:</label>
        <input type="text" id="phone-input" placeholder="Ví dụ: 123213123">

        <label for="token-input">Mã Token định danh bảo mật:</label>
        <input type="text" id="token-input" placeholder="Nhập mã Token định danh bảo mật">

        <button onclick="startPolling()">Kết nối hệ thống</button>
    </div>

    <div id="monitor-screen" class="box hidden">
        <h2 style="margin-top:0;">Thiết bị: <span id="display-phone"></span></h2>
        <p id="status-text" style="color: #666666; font-size: 13px; margin-bottom: 12px;"></p>
        <button onclick="stopPolling()"
            style="background: #666666; padding: 6px 12px; font-size: 13px; width: auto; font-weight: normal; margin-bottom: 15px;">Đăng
            xuất / Ngắt kết nối</button>
        <div id="log-list" style="max-height: 650px; overflow-y: auto;"></div>
    </div>

    <script>
        // Bạn có thể sửa thành "/api/fetch" hoặc đường dẫn tuyệt đối tùy cấu hình chạy của bạn
        const API_URL = "/api/fetch";
        let inputPhone = "";
        let inputToken = "";
        let pollInterval = null;

        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        window.onload = function () {
            const savedPhone = localStorage.getItem("saved_user_phone");
            const savedToken = localStorage.getItem("saved_user_token");

            if (savedPhone && savedToken) {
                document.getElementById("phone-input").value = savedPhone;
                document.getElementById("token-input").value = savedToken;
                startPolling();
            }
        };

        function startPolling() {
            const phoneField = document.getElementById("phone-input");
            const tokenField = document.getElementById("token-input");

            if (!phoneField || !tokenField) return;

            inputPhone = phoneField.value.trim();
            inputToken = tokenField.value.trim();

            if (!inputPhone || !inputToken) {
                return alert("Vui lòng điền đầy đủ cả Số điện thoại và Token!");
            }

            localStorage.setItem("saved_user_phone", inputPhone);
            localStorage.setItem("saved_user_token", inputToken);

            document.getElementById("login-screen").style.display = "none";
            document.getElementById("monitor-screen").classList.remove("hidden");
            document.getElementById("display-phone").innerText = inputPhone;

            if (pollInterval) clearInterval(pollInterval);
            syncLogs();
            pollInterval = setInterval(syncLogs, 3000);
        }

        function syncLogs() {
            if (!inputPhone || !inputToken) return;

            fetch(`${API_URL}?phone=${inputPhone}&token=${encodeURIComponent(inputToken)}`)
                .then(res => res.json())
                .then(serverLogs => {
                    const statusTxt = document.getElementById("status-text");

                    if (!serverLogs || serverLogs.length === 0) {
                        statusTxt.innerText = "⚠️ Sai Token hoặc thiết bị chưa kích hoạt đẩy dữ liệu lên!";
                        statusTxt.style.color = "#333";
                        document.getElementById("log-list").innerHTML = "<p style='text-align:center; color:#999; font-size: 14px;'>Không có quyền truy cập dữ liệu (Tệp trống).</p>";
                        return;
                    }

                    statusTxt.innerText = "🔄 Đang kiểm tra dữ liệu: " + new Date().toLocaleTimeString();
                    statusTxt.style.color = "#333";

                    serverLogs.sort((a, b) => b.id.localeCompare(a.id));

                    const localCacheKey = `cache_${inputPhone}`;
                    const localLogs = JSON.parse(localStorage.getItem(localCacheKey)) || [];
                    const localIds = localLogs.map(item => item.id);

                    let isAnyNew = false;
                    serverLogs.forEach(sItem => {
                        if (localIds.length > 0 && !localIds.includes(sItem.id)) {
                            sendBrowserPush(sItem);
                            isAnyNew = true;
                        }
                    });

                    localStorage.setItem(localCacheKey, JSON.stringify(serverLogs));
                    renderLogs(serverLogs);
                })
                .catch(() => {
                    document.getElementById("status-text").innerText = "❌ Mất kết nối tới máy chủ Server.";
                    document.getElementById("status-text").style.color = "#333";
                });
        }

        function sendBrowserPush(item) {
            if (Notification.permission === "granted") {
                const title = item.type === "CALL" ? "📞 Cuộc gọi đến mới!" : "💬 Tin nhắn SMS mới!";
                new Notification(title, {
                    body: `Số máy: ${item.incomingNumber}\nNội dung: ${item.content || 'Đang đổ chuông...'}`,
                });
            }
        }

        function renderLogs(logs) {
            const listDiv = document.getElementById("log-list");
            listDiv.innerHTML = "";

            logs.forEach(item => {
                // Chuẩn hóa dữ liệu: Chuyển hết thành chữ HOA để tránh lệch pha chữ hoa/chữ thường
                const currentType = (item.type || '').toUpperCase().trim();

                const div = document.createElement("div");
                // Gán class CALL hoặc SMS chính xác sau khi đã chuẩn hóa
                div.className = `log-item ${currentType === 'CALL' ? 'CALL' : 'SMS'}`;

                div.innerHTML = `
            <div class="meta">
                <span><strong>${currentType === 'CALL' ? 'CUỘC GỌI ĐẾN' : 'TIN NHẮN SMS'}</strong></span>
                <span>${item.time}</span>
            </div>
            <div>
                <span class="log-target">Đối tác: ${item.incomingNumber}</span>
                <span class="log-content">${item.content ? item.content : '<i>(Trống)</i>'}</span>
            </div>
        `;
                listDiv.appendChild(div);
            });
        }

        function stopPolling() {
            clearInterval(pollInterval);
            localStorage.removeItem("saved_user_phone");
            localStorage.removeItem("saved_user_token");

            document.getElementById("phone-input").value = "";
            document.getElementById("token-input").value = "";

            document.getElementById("login-screen").style.display = "block";
            document.getElementById("monitor-screen").classList.add("hidden");
        }
    </script>
</body>

</html>
