<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Informing portal</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f4f6f8;
            padding: 20px;
        }

        .box {
            max-width: 550px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .hidden {
            display: none;
        }

        input {
            width: 100%;
            padding: 11px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
        }

        button:hover {
            background: #27ae60;
        }

        .log-item {
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 5px solid #ccc;
            background: #fafafa;
        }

        .CALL {
            border-left-color: #e67e22;
            background: #fff5eb;
        }

        .SMS {
            border-left-color: #2ecc71;
            background: #f0fdf4;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #7f8c8d;
        }
    </style>
</head>

<body>

    <div id="login-screen" class="box">
        <h2>Đồng bộ thiết bị di động</h2>
        <label for="phone-input" style="font-weight: bold; font-size: 0.9em;">Số điện thoại thiết bị:</label>
        <input type="text" id="phone-input" placeholder="Nhập số điện thoại thiết bị (Ví dụ: 0912345678)">

        <label for="token-input" style="font-weight: bold; font-size: 0.9em; margin-top: 10px; display: block;">Mã Token
            định danh bảo mật:</label>
        <input type="text" id="token-input" placeholder="Nhập mã Token định danh bảo mật">

        <button onclick="startPolling()">Kết nối hệ thống</button>
    </div>

    <div id="monitor-screen" class="box hidden">
        <h2 style="margin-top:0;">Thiết bị: <span id="display-phone" style="color:#27ae60;"></span></h2>
        <p id="status-text" style="color: #7f8c8d; font-size: 0.9em;"></p>
        <button onclick="stopPolling()" style="background: #e74c3c;">Đăng xuất / Ngắt kết nối</button>
        <div id="log-list" style="margin-top: 15px; max-height: 500px; overflow-y: auto;"></div>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api/fetch";
        let inputPhone = "";
        let inputToken = "";
        let pollInterval = null;

        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        // ==========================================
        // ⚙️ TỰ ĐỘNG KHỞI CHẠY KHI MỞ TRANG / REFRESH
        // ==========================================
        window.onload = function () {
            // Đọc thông tin cấu hình cũ đã lưu trong máy
            const savedPhone = localStorage.getItem("saved_user_phone");
            const savedToken = localStorage.getItem("saved_user_token");

            // Nếu có dữ liệu cũ, tự động điền vào ô và kích hoạt chạy luôn
            if (savedPhone && savedToken) {
                document.getElementById("phone-input").value = savedPhone;
                document.getElementById("token-input").value = savedToken;

                console.log("Tìm thấy cấu hình cũ, tự động đăng nhập...");
                startPolling();
            }
        };

        function startPolling() {
            const phoneField = document.getElementById("phone-input");
            const tokenField = document.getElementById("token-input");

            if (!phoneField || !tokenField) return;

            inputPhone = phoneField.value.trim();
            inputToken = tokenField.value.trim();

            if (!inputPhone || !inputToken) {
                return alert("Vui lòng điền đầy đủ cả Số điện thoại và Token!");
            }

            // ĐỒNG BỘ: Lưu thông tin cấu hình vào Local Browser để không bị mất khi F5
            localStorage.setItem("saved_user_phone", inputPhone);
            localStorage.setItem("saved_user_token", inputToken);

            // Chuyển màn hình giao diện
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("monitor-screen").classList.remove("hidden");
            document.getElementById("display-phone").innerText = inputPhone;

            // Tiến hành poll chu kỳ 3 giây
            if (pollInterval) clearInterval(pollInterval);
            syncLogs();
            pollInterval = setInterval(syncLogs, 3000);
        }

        function syncLogs() {
            if (!inputPhone || !inputToken) return;

            fetch(`${API_URL}?phone=${inputPhone}&token=${encodeURIComponent(inputToken)}`)
                .then(res => res.json())
                .then(serverLogs => {
                    const statusTxt = document.getElementById("status-text");

                    // 1. Kiểm tra nếu tệp trống từ server
                    if (!serverLogs || serverLogs.length === 0) {
                        statusTxt.innerText = "⚠️ Sai Token hoặc thiết bị chưa có dữ liệu!";
                        statusTxt.style.color = "#e74c3c";
                        document.getElementById("log-list").innerHTML = "<p style='text-align:center; color:#999;'>Không có quyền truy cập dữ liệu (Tệp trống).</p>";
                        return;
                    }

                    // Kết nối thành công
                    statusTxt.innerText = "🔄 Đang kiểm tra dữ liệu: " + new Date().toLocaleTimeString();
                    statusTxt.style.color = "#27ae60";

                    // 2. Sắp xếp dữ liệu từ mới đến cũ
                    serverLogs.sort((a, b) => b.id.localeCompare(a.id));

                    // 3. Đọc cache cũ dưới máy tính để chuẩn bị đối chiếu bắn thông báo đẩy
                    const localCacheKey = `cache_${inputPhone}`;
                    const localLogs = JSON.parse(localStorage.getItem(localCacheKey)) || [];
                    const localIds = localLogs.map(item => item.id);

                    // Duyệt xem có ID nào mới tinh chưa từng có ở local không để bắn Notification
                    serverLogs.forEach(sItem => {
                        if (localIds.length > 0 && !localIds.includes(sItem.id)) {
                            sendBrowserPush(sItem); // Có cái mới hoàn toàn thì bắn thông báo nổi
                        }
                    });

                    // 4. ÉP LƯU CACHE VÀ ÉP VẼ LẠI GIAO DIỆN (Bất kể chiều dài mảng thế nào)
                    localStorage.setItem(localCacheKey, JSON.stringify(serverLogs));
                    renderLogs(serverLogs);
                })
                .catch((err) => {
                    console.error("Lỗi fetch:", err);
                    document.getElementById("status-text").innerText = "❌ Mất kết nối tới máy chủ Server.";
                    document.getElementById("status-text").style.color = "#e74c3c";
                });
        }

        function sendBrowserPush(item) {
            if (Notification.permission === "granted") {
                const title = item.type === "CALL" ? "📞 Cuộc gọi đến mới!" : "💬 Tin nhắn SMS mới!";
                new Notification(title, {
                    body: `Số máy: ${item.incomingNumber}\nNội dung: ${item.content || 'Đang đổ chuông...'}`,
                });
            }
        }

        function renderLogs(logs) {
            const listDiv = document.getElementById("log-list");

            // Nếu mảng rỗng, thông báo không có dữ liệu
            if (!logs || logs.length === 0) {
                listDiv.innerHTML = "<p style='text-align:center; color:#999;'>Không có dữ liệu cuộc gọi hay tin nhắn nào.</p>";
                return;
            }

            listDiv.innerHTML = ""; // Xóa sạch giao diện cũ để nạp lại

            logs.forEach(item => {
                const div = document.createElement("div");
                // Đảm bảo gán class CALL hoặc SMS để đổ màu nền
                div.className = `log-item ${item.type || 'CALL'}`;

                // Thiết lập nội dung hiển thị hiển thị chính xác theo data của bạn
                div.innerHTML = `
            <div class="meta">
                <strong>${item.type === 'CALL' ? '🍊 CUỘC GỌI ĐẾN' : '🍏 TIN NHẮN SMS'}</strong>
                <span>${item.time}</span>
            </div>
            <div style="font-weight: bold; margin-top: 6px; color: #2c3e50;">Số máy đối tác: ${item.incomingNumber}</div>
            <div class="log-content" style="margin-top: 6px; font-size: 0.95em; color: #555; background: rgba(255,255,255,0.6); padding: 6px; border-radius: 4px;">
                ${item.content ? item.content : '<i>(Đang đổ chuông...)</i>'}
            </div>
        `;
                listDiv.appendChild(div);
            });
        }

        function stopPolling() {
            // Dừng vòng lặp poll 3 giây
            clearInterval(pollInterval);

            // XÓA SẠCH: Xóa thông tin cấu hình cũ khỏi bộ nhớ browser khi bấm Đăng xuất
            localStorage.removeItem("saved_user_phone");
            localStorage.removeItem("saved_user_token");

            // Reset trống các ô nhập liệu
            document.getElementById("phone-input").value = "";
            document.getElementById("token-input").value = "";

            // Trả giao diện về trạng thái ban đầu
            document.getElementById("login-screen").style.display = "block";
            document.getElementById("monitor-screen").classList.add("hidden");
        }
    </script>
</body>

</html>
